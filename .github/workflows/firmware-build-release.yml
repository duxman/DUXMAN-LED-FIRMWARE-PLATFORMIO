name: Firmware Build and Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - esp32c3supermini
          - esp32dev
          - esp32s3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e ${{ matrix.environment }}

      - name: Package artifacts
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR=".pio/build/${{ matrix.environment }}"
          OUT_DIR="dist/${{ matrix.environment }}"
          VERSION="${GITHUB_REF_NAME}"

          mkdir -p "${OUT_DIR}"

          if [ -f "${BUILD_DIR}/firmware.bin" ]; then cp "${BUILD_DIR}/firmware.bin" "${OUT_DIR}/"; fi
          if [ -f "${BUILD_DIR}/bootloader.bin" ]; then cp "${BUILD_DIR}/bootloader.bin" "${OUT_DIR}/"; fi
          if [ -f "${BUILD_DIR}/partitions.bin" ]; then cp "${BUILD_DIR}/partitions.bin" "${OUT_DIR}/"; fi
          if [ -f "${BUILD_DIR}/firmware.elf" ]; then cp "${BUILD_DIR}/firmware.elf" "${OUT_DIR}/"; fi
          if [ -f "${BUILD_DIR}/firmware.map" ]; then cp "${BUILD_DIR}/firmware.map" "${OUT_DIR}/"; fi

          zip -j "dist/duxman-${{ matrix.environment }}-${VERSION}.zip" "${OUT_DIR}"/*

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.environment }}
          path: dist/duxman-${{ matrix.environment }}-*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip > SHA256SUMS.txt

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.tag.outputs.value }}"
          VERSION="${TAG#v}"

          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "ERROR: Missing CHANGELOG section for version ${VERSION}."
            echo "Expected heading: ## [${VERSION}] - YYYY-MM-DD"
            exit 1
          fi

          awk -v version="$VERSION" '
            BEGIN { in_section=0 }
            $0 ~ "^## \\\[" version "\\\]" { in_section=1; print; next }
            $0 ~ "^## \\\[" && in_section==1 { exit }
            in_section==1 { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md

          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "ERROR: Could not extract release notes from CHANGELOG.md"
            exit 1
          fi

      - name: Create or update release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
