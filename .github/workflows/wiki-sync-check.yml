name: Wiki Sync Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish docs/wiki to GitHub Wiki
        shell: pwsh
        run: |
          ./tools/wiki-sync.ps1 -Mode push -WikiUrl "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.wiki.git"
