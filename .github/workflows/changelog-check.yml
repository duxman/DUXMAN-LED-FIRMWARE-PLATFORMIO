name: Changelog Check

on:
  pull_request:

jobs:
  changelog-required:
    name: Require CHANGELOG update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md changed in PR
        shell: bash
        run: |
          set -euo pipefail
          BASE_REF="${{ github.base_ref }}"
          git fetch origin "${BASE_REF}" --depth=1

          if git diff --name-only "origin/${BASE_REF}...HEAD" | grep -qx "CHANGELOG.md"; then
            echo "CHANGELOG.md updated: OK"
            exit 0
          fi

          echo "ERROR: This PR must include an update to CHANGELOG.md"
          echo "Please add an entry under [Unreleased] or create a version section if you are preparing a release."
          exit 1
